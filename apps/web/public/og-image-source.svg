<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="frame"><rect width="1200" height="630" rx="48"/></clipPath>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d6e7f2"/>
    </pattern>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#dff1fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#dots)" opacity="0.75"/>
    <circle cx="1010" cy="96" r="170" fill="#55a0cf" opacity="0.22"/>
    <circle cx="106" cy="556" r="210" fill="#55a0cf" opacity="0.18"/>

    <rect x="74" y="64" width="1052" height="502" rx="44" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="74" y="64" width="1052" height="502" rx="44" fill="none" stroke="#b8dff2" stroke-width="2"/>

    <rect x="132" y="128" width="112" height="112" rx="28" fill="#55a0cf"/>
    <image xlink:href="logo.png" x="154" y="150" width="68" height="68" preserveAspectRatio="xMidYMid meet"/>

    <text x="132" y="328" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-3">Blockade</text>
    <text x="132" y="408" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600">Block distractions. Regain your focus.</text>
    <text x="132" y="468" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="500">Take control of your time and build better habits.</text>

    <rect x="804" y="158" width="226" height="314" rx="34" fill="#0f172a"/>
    <rect x="830" y="192" width="174" height="24" rx="12" fill="#55a0cf"/>
    <rect x="830" y="246" width="126" height="20" rx="10" fill="#e2e8f0" opacity="0.95"/>
    <rect x="830" y="292" width="148" height="20" rx="10" fill="#e2e8f0" opacity="0.75"/>
    <rect x="830" y="338" width="98" height="20" rx="10" fill="#e2e8f0" opacity="0.55"/>
    <circle cx="982" cy="404" r="48" fill="#55a0cf"/>
    <path d="M960 404l15 15 31-36" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
